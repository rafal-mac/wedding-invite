<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<!-- Source used to render og-image.png (the link-preview thumbnail). Re-screenshot at 1200x630 if edited. -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { background: #fdf8f0; display: flex; align-items: center; justify-content: center; }
  .env { position: relative; width: 620px; height: 440px; box-shadow: 0 26px 60px rgba(74, 46, 61, 0.18); border-radius: 2px; }
  .env-body { position: absolute; inset: 0; background: #facfd9; z-index: 1; }
  .env-flap { position: absolute; top: 0; left: 0; width: 100%; height: 55%; background: #b9def8; clip-path: polygon(0 0, 50% 100%, 100% 0); z-index: 2; }
  .env-seal {
    position: absolute; top: 242px; left: 50%; transform: translateX(-50%);
    width: 150px; height: 150px; border-radius: 50%; background: #fff8ee; z-index: 3;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 5px 16px rgba(74, 46, 61, 0.12);
  }
  .env-seal span { font-family: 'Cormorant Garamond', serif; color: #4a2e3d; font-weight: 600; font-size: 21px; letter-spacing: 0.09em; text-align: center; line-height: 1.2; }
</style></head>
<body>
  <div class="env">
    <div class="env-body"></div>
    <div class="env-flap"></div>
    <div class="env-seal"><span>YOU'RE<br>INVITED</span></div>
  </div>
</body></html>
